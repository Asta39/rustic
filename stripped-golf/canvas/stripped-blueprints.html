<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one full-screen drafting board you pan and zoom; sheets sit on it like pinned drawings, chrome floats at the edges. Single deliberate dark blueprint look. */
:root{
  --paper:#0e3561;      /* blueprint ground */
  --paper-deep:#0a2848; /* sheet ground */
  --grid:rgba(160,205,255,.10);
  --grid-major:rgba(160,205,255,.20);
  --line:#eaf3ff;       /* drawn line */
  --cyan:#8fd0ff;       /* dimensions and callouts */
  --dim:#9cb8d8;        /* secondary text */
  --chrome:rgba(8,30,56,.92);
  --chrome-line:rgba(160,205,255,.28);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--paper);color:var(--line);font-family:var(--mono);overflow:hidden;margin:0}
#board{position:fixed;inset:0;touch-action:none;cursor:grab;display:block;width:100%;height:100%}
#board.dragging{cursor:grabbing}
.chrome{position:fixed;background:var(--chrome);border:1px solid var(--chrome-line);border-radius:4px;backdrop-filter:blur(6px)}
#brand{top:calc(12px + env(safe-area-inset-top,0px));left:16px;display:flex;align-items:center;gap:10px;padding:8px 12px}
#brand svg{width:22px;height:22px;display:block}
#brand b{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.14em}
#brand span{color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
#tools{bottom:calc(12px + env(safe-area-inset-bottom,0px));left:16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px;max-width:calc(100% - 32px)}
button{font:500 12px var(--mono);color:var(--line);background:transparent;border:1px solid var(--chrome-line);border-radius:3px;padding:6px 10px;cursor:pointer;letter-spacing:.04em}
button:hover{border-color:var(--cyan);color:var(--cyan)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button[aria-pressed="true"]{background:var(--cyan);color:var(--paper-deep);border-color:var(--cyan)}
#zoomval{min-width:48px;text-align:center;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.sep{width:1px;height:20px;background:var(--chrome-line)}
#panel{top:calc(12px + env(safe-area-inset-top,0px));right:16px;width:300px;max-width:calc(100% - 32px);padding:12px;display:flex;flex-direction:column;gap:10px}
#panel h2{margin:0;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.06em;text-wrap:balance}
#panel .meta{color:var(--dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
#panel ol{margin:0;padding-left:20px;font-size:12px;line-height:1.55;color:var(--line)}
#panel label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
#notes{width:100%;box-sizing:border-box;min-height:84px;resize:vertical;background:var(--paper-deep);color:var(--line);border:1px solid var(--chrome-line);border-radius:3px;font:12px/1.5 var(--mono);padding:8px}
.row{display:flex;gap:6px;flex-wrap:wrap}
#status{font-size:11px;color:var(--cyan);min-height:14px}
#hint{color:var(--dim);font-size:11px;line-height:1.5}
@media (max-width:640px){
  #panel{top:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));right:16px;left:16px;width:auto;max-height:42vh;overflow:auto}
  #brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<aside id="panel" class="chrome" aria-live="polite">

const CSSV=getComputedStyle(document.documentElement);
function R(str){return str.replace(/var\(--([a-z-]+)\)/g,(m,n)=>CSSV.getPropertyValue("--"+n).trim()||m);}
document.querySelectorAll("svg [fill^='var'],svg [stroke^='var']").forEach(n=>{["fill","stroke"].forEach(a=>{const v=n.getAttribute(a);if(v&&v.startsWith("var"))n.setAttribute(a,R(v));});});
function el(tag,attrs,html){if(html!=null)html=R(html);const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,typeof attrs[k]==="string"?R(attrs[k]):attrs[k]);if(html!=null)e.innerHTML=html;return e;}

function dimLine(d){
  let s=`<line x1="${d.x1}" y1="${d.y1}" x2="${d.x2}" y2="${d.y2}" stroke="var(--cyan)" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>`;
  const mx=(d.x1+d.x2)/2,my=(d.y1+d.y2)/2,fs=d.small?11:12;
  if(d.v){s+=`<text x="${mx+8}" y="${my}" fill="var(--cyan)" font-family="var(--mono)" font-size="${fs}" transform="rotate(90 ${mx+8} ${my})" text-anchor="middle">${d.t}</text>`;}
  else{const ty=d.above?my-8:my+16;s+=`<text x="${mx}" y="${ty}" fill="var(--cyan)" font-family="var(--mono)" font-size="${fs}" text-anchor="middle">${d.t}</text>`;}
  return s;
}

  return `<g><circle cx="${c[0]}" cy="${c[1]}" r="10" fill="var(--paper-deep)" stroke="var(--cyan)" stroke-width="1.4"/><text x="${c[0]}" y="${c[1]+4}" fill="var(--cyan)" font-family="var(--mono)" font-size="11" font-weight="500" text-anchor="middle">${c[2]}</text></g>`;
}
function view(g,side){
  let s=`<path d="${g.outline[side]}" fill="none" stroke="var(--line)" stroke-width="2.4" stroke-linejoin="round"/>`;
  g.solid[side].forEach(p=>s+=`<path d="${p}" fill="none" stroke="var(--line)" stroke-width="1.8" stroke-linecap="round"/>`);
  g.dashed[side].forEach(p=>s+=`<path d="${p}" fill="none" stroke="var(--line)" stroke-width="1.1" stroke-dasharray="5 4" opacity=".85"/>`);
  s+=g.extra[side];
  const L=g.logo[side];
  if(L){const sc=L[2]/256;s+=`<use href="#logo" fill="var(--line)" opacity="${L[3]||1}" transform="translate(${L[0]-L[2]/2} ${L[1]-L[2]/2}) scale(${sc})"/>`;}
  g.dims[side].forEach(d=>s+=dimLine(d));
  g.callouts[side].forEach(c=>s+=callout(c));
  return s;
}
function sheetSVG(sh){
  const W=1400,H=900;
  let s=`<rect width="${W}" height="${H}" fill="var(--paper-deep)" stroke="var(--line)" stroke-width="2"/>`;
  s+=`<rect x="16" y="16" width="${W-32}" height="${H-32}" fill="none" stroke="var(--line)" stroke-width="1" opacity=".6"/>`;
  s+=`<g transform="translate(24 44) scale(.9)">${view(sh.g,"front")}<text x="300" y="700" fill="var(--dim)" font-family="var(--mono)" font-size="13" letter-spacing="2" text-anchor="middle">FRONT VIEW</text></g>`;
  s+=`<g transform="translate(556 44) scale(.9)">${view(sh.g,"back")}<text x="300" y="700" fill="var(--dim)" font-family="var(--mono)" font-size="13" letter-spacing="2" text-anchor="middle">BACK VIEW</text></g>`;
  // title block
  const tx=W-436,ty=H-236;
  s+=`<g transform="translate(${tx} ${ty})" font-family="var(--mono)">
    <rect width="420" height="220" fill="var(--paper-deep)" stroke="var(--line)" stroke-width="1.5"/>
    <line x1="0" y1="64" x2="420" y2="64" stroke="var(--line)" stroke-width="1"/>
    <line x1="0" y1="124" x2="420" y2="124" stroke="var(--line)" stroke-width="1" opacity=".6"/>
    <line x1="0" y1="172" x2="420" y2="172" stroke="var(--line)" stroke-width="1" opacity=".6"/>
    <line x1="210" y1="124" x2="210" y2="220" stroke="var(--line)" stroke-width="1" opacity=".6"/>
    <use href="#logo" fill="var(--line)" transform="translate(16 14) scale(${36/256})"/>
    <text x="64" y="32" fill="var(--line)" font-family="var(--display)" font-weight="700" font-size="22" letter-spacing="3">STRIPPED GOLF</text>
    <text x="64" y="52" fill="var(--dim)" font-size="11" letter-spacing="1">TECHNICAL FLAT · NOT TO SCALE · CM</text>
    <text x="16" y="88" fill="var(--dim)" font-size="10" letter-spacing="1">STYLE</text>
    <text x="16" y="110" fill="var(--line)" font-family="var(--display)" font-weight="600" font-size="${(sh.style+sh.name).length>26?17:22}" letter-spacing="1">${sh.style} · ${sh.name.toUpperCase()}</text>
    <text x="16" y="142" fill="var(--dim)" font-size="10" letter-spacing="1">SIZE</text><text x="16" y="162" fill="var(--line)" font-size="13">${sh.size}</text>
    <text x="226" y="142" fill="var(--dim)" font-size="10" letter-spacing="1">REV / DATE</text><text x="226" y="162" fill="var(--line)" font-size="13">${sh.rev} · 2026-10-08</text>
    <text x="16" y="190" fill="var(--dim)" font-size="10" letter-spacing="1">FABRIC</text><text x="16" y="208" fill="var(--line)" font-size="10.5">${sh.fabric.length>30?sh.fabric.slice(0,30)+"…":sh.fabric}</text>
    <text x="226" y="190" fill="var(--dim)" font-size="10" letter-spacing="1">COLOURWAY</text><text x="226" y="208" fill="var(--line)" font-size="11">Black / White / Stone</text>
  </g>`;
  // legend
  s+=`<g transform="translate(40 ${H-60})" font-family="var(--mono)" font-size="11" fill="var(--dim)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="var(--line)" stroke-width="2"/><text x="42" y="4">SEAM / EDGE</text>
    <line x1="150" y1="0" x2="184" y2="0" stroke="var(--line)" stroke-width="1.1" stroke-dasharray="5 4"/><text x="192" y="4">TOPSTITCH</text>
    <line x1="290" y1="0" x2="324" y2="0" stroke="var(--cyan)" stroke-width="1.2"/><text x="332" y="4">MEASUREMENT</text>
  </g>`;
  return s;
}

// ghost sheet: where the next design goes
function ghostSVG(){
  return `<rect width="1400" height="900" fill="none" stroke="var(--dim)" stroke-width="2" stroke-dasharray="14 10" opacity=".6"/>
  <text x="700" y="430" fill="var(--dim)" font-family="var(--display)" font-weight="600" font-size="40" letter-spacing="4" text-anchor="middle">NEXT SHEET</text>
  <text x="700" y="470" fill="var(--dim)" font-family="var(--mono)" font-size="15" text-anchor="middle">Describe a garment to Claude and it gets drafted here</text>`;
}

SHEETS.forEach(sh=>{
  const g=el("g",{transform:`translate(${sh.x} ${sh.y})`,"data-id":sh.id,tabindex:"0",role:"button","aria-label":`${sh.style} ${sh.name} sheet`,style:"cursor:pointer"},sheetSVG(sh));
  sh.node=g;world.appendChild(g);
});
world.appendChild(el("g",{transform:"translate(1520 1120)"},ghostSVG()));
[["POLOS · 5 STYLES",0,-30],["LAYERS",0,1090]].forEach(([t,x,y])=>world.appendChild(el("text",{x,y,fill:"var(--dim)","font-family":"var(--display)","font-weight":"600","font-size":"34","letter-spacing":"6"},t)));

/* ---------- pan / zoom via viewBox ---------- */
let vb={x:-200,y:-200,w:8000,h:2400};
const BOUNDS={x:-80,y:-90,w:7640,h:2140};
function apply(){
  board.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const r=board.getBoundingClientRect();
  const z=Math.min(r.width/vb.w,r.height/vb.h);
  document.getElementById("zoomval").textContent=Math.round(z*100)+"%";
}
function fitTo(b,pad){
  const r=board.getBoundingClientRect();pad=pad||0.08;
  const aspect=r.width/r.height;
  let w=b.w*(1+pad*2),h=b.h*(1+pad*2);
  if(w/h<aspect)w=h*aspect;else h=w/aspect;
  vb={x:b.x+b.w/2-w/2,y:b.y+b.h/2-h/2,w,h};apply();
}
function toWorld(cx,cy){
  const r=board.getBoundingClientRect();
  const s=Math.max(vb.w/r.width,vb.h/r.height);
  const ox=(r.width*s-vb.w)/2,oy=(r.height*s-vb.h)/2;
  return {x:vb.x-ox+(cx-r.left)*s,y:vb.y-oy+(cy-r.top)*s,s};
}
function zoomAt(cx,cy,f){
  const p=toWorld(cx,cy);
  const nw=Math.min(Math.max(vb.w*f,300),40000);const k=nw/vb.w;
  vb={x:p.x-(p.x-vb.x)*k,y:p.y-(p.y-vb.y)*k,w:nw,h:vb.h*k};apply();
}
board.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(e.deltaY*0.0015));},{passive:false});

const ptrs=new Map();let moved=0,pinch=null;
board.addEventListener("pointerdown",e=>{board.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;board.classList.add("dragging");
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};}});
board.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId);const cur={x:e.clientX,y:e.clientY};ptrs.set(e.pointerId,cur);
  if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(d>0){zoomAt((a.x+b.x)/2,(a.y+b.y)/2,pinch.d/d);pinch.d=d;}moved+=10;return;}
  const s=toWorld(0,0).s;const dx=cur.x-prev.x,dy=cur.y-prev.y;moved+=Math.abs(dx)+Math.abs(dy);
  vb.x-=dx*s;vb.y-=dy*s;apply();
});
function endPtr(e){
  const wasClick=ptrs.size===1&&moved<5;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(!ptrs.size)board.classList.remove("dragging");
  if(wasClick&&e.type==="pointerup"){const t=document.elementFromPoint(e.clientX,e.clientY);const g=t&&t.closest&&t.closest("[data-id]");if(g)select(g.getAttribute("data-id"));}
}
board.addEventListener("pointerup",endPtr);board.addEventListener("pointercancel",endPtr);

/* ---------- selection, notes, copy ---------- */
let current=null;
const btnWrap=document.getElementById("sheetBtns");
SHEETS.forEach(sh=>{const b=document.createElement("button");b.type="button";b.textContent=sh.style;b.id="btn-"+sh.id;b.addEventListener("click",()=>{select(sh.id);focusSheet(sh);});btnWrap.appendChild(b);
  sh.node.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(sh.id);focusSheet(sh);}});});
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(_){return null;}}
function select(id){
  const sh=SHEETS.find(s=>s.id===id);if(!sh)return;current=sh;
  SHEETS.forEach(s=>{document.getElementById("btn-"+s.id).setAttribute("aria-pressed",s===sh?"true":"false");s.node.querySelector("rect").setAttribute("stroke",R(s===sh?"var(--cyan)":"var(--line)"));});
  document.getElementById("pMeta").textContent=`${sh.style} · Rev ${sh.rev} · ${sh.size}`;
  document.getElementById("pTitle").textContent=sh.name;
  document.getElementById("pCallouts").innerHTML=sh.items.map(t=>`<li>${t}</li>`).join("");
  document.getElementById("notes").value=store("notes:"+sh.id)||"";
  document.getElementById("status").textContent="";
  store("lastSheet",sh.id);
}
function focusSheet(sh){fitTo({x:sh.x,y:sh.y,w:1400,h:900},0.04);}
document.getElementById("notes").addEventListener("input",e=>{if(current)store("notes:"+current.id,e.target.value);});
document.getElementById("focusBtn").addEventListener("click",()=>current&&focusSheet(current));
document.getElementById("copySvg").addEventListener("click",()=>{
  if(!current)return;
  const inner=current.node.innerHTML;
  const logo=document.getElementById("logo").outerHTML;const arr=document.getElementById("arr").outerHTML;
  const out=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900"><defs>${logo}${arr}</defs>${inner}</svg>`;
  const st=document.getElementById("status");
  navigator.clipboard.writeText(out).then(()=>st.textContent="Copied. Paste into Figma or Illustrator, or save as .svg.").catch(()=>st.textContent="Copy was blocked here. Ask Claude for the SVG file instead.");
});
document.getElementById("zIn").addEventListener("click",()=>{const r=board.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,0.8);});
document.getElementById("zOut").addEventListener("click",()=>{const r=board.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.25);});
document.getElementById("fit").addEventListener("click",()=>fitTo(BOUNDS));
window.addEventListener("resize",apply);

select(store("lastSheet")||SHEETS[0].id);
fitTo(BOUNDS);
})();
</script>
